services:
  postgres:
    image: postgres:16-alpine
    container_name: loot_postgres
    environment:
      POSTGRES_USER: lootuser
      POSTGRES_PASSWORD: lootpass
      POSTGRES_DB: lootdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lootuser -d lootdb"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: .
    container_name: loot_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://lootuser:lootpass@postgres:5432/lootdb?sslmode=disable"
      GAMEPLAY_SERVER_SECRET: "trusted-gameplay-server-secret-2026"
      EXCHANGE_WINDOW_SECONDS: "300"
    ports:
      - "8080:8080"

volumes:
  pgdata:
